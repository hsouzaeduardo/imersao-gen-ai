# Plano B da aula: tudo local, sem depender do Azure para a camada de dados.
# O modelo continua vindo do Azure OpenAI, só a infra de dados fica no notebook.
#
# Os valores de Postgres aqui são fixos de propósito, e não lidos do .env.
# O Compose carrega o .env sozinho, então um `${POSTGRES_HOST:-postgres}`
# faria o Plano B apontar para o Azure justamente quando ele existe para
# ser a rota de fuga do Azure. Para usar o banco gerenciado, o arquivo é
# o docker-compose.azure-db.yml.
services:
  postgres:
    image: postgres:16-alpine
    container_name: aurora-postgres
    environment:
      POSTGRES_USER: aurora
      POSTGRES_PASSWORD: aurora
      POSTGRES_DB: aurora_fibra
    ports: ["5432:5432"]
    volumes:
      - ./data/seed_aurora.sql:/docker-entrypoint-initdb.d/01_seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aurora -d aurora_fibra"]
      interval: 5s
      timeout: 3s
      retries: 10

  toolbox:
    image: us-central1-docker.pkg.dev/database-toolbox/toolbox/toolbox:latest
    container_name: aurora-toolbox
    depends_on:
      postgres:
        condition: service_healthy
    command: ["toolbox", "--tools-file", "/config/tools.yaml", "--address", "0.0.0.0", "--port", "5000"]
    ports: ["5000:5000"]
    volumes:
      - ./lab04_mcp_toolbox/tools.yaml:/config/tools.yaml:ro
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: aurora_fibra
      POSTGRES_USER: aurora
      POSTGRES_PASSWORD: aurora

  mock_api:
    image: python:3.12-slim
    container_name: aurora-mock-api
    working_dir: /app
    command: >
      sh -c "pip install --no-cache-dir fastapi uvicorn &&
             uvicorn main:app --host 0.0.0.0 --port 8000"
    ports: ["8000:8000"]
    volumes:
      - ./mock_api:/app:ro

  redis:
    image: redis:7-alpine
    container_name: aurora-redis
    ports: ["6379:6379"]
